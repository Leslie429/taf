# Déploiement sur Render — sans carte bancaire.
#
# La base n'est pas ici : elle vit chez Neon. Ce n'est pas un détail de
# commodité — la base PostgreSQL gratuite de Render expire au bout de 90 jours,
# celle de Neon non. Le blueprint ne provisionne donc aucune base et attend une
# chaîne de connexion.
#
# À savoir : les services gratuits s'endorment au bout de quinze minutes sans
# trafic, et le premier appel qui les réveille prend une trentaine de secondes.
#
#   1. Render → New → Blueprint → sélectionner ce dépôt
#   2. Renseigner les variables marquées « sync: false » ci-dessous
#   3. Après le premier déploiement, revenir poser CORS_ORIGINS et
#      VITE_API_URL avec les URL réelles, puis redéployer le front — son URL
#      d'API est figée à la compilation.
#
# Ne pas deviner ces URL : quand un nom de service est déjà pris ailleurs sur
# Render, un suffixe est ajouté — « tontine-api-jhph.onrender.com » plutôt que
# « tontine-api.onrender.com ». Attendre que les services existent pour lire
# leurs URL réelles.

services:
  - type: web
    name: tontine-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Render réserve la commande de pré-déploiement aux offres payantes : la
    # migration repasse donc au démarrage du conteneur. C'est sans risque ici,
    # l'offre gratuite ne lançant qu'une instance — sur Fly, où deux machines
    # tournent, la même chose ferait courir deux migrations en concurrence.
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    envVars:
      # Render route vers ce port ; il doit correspondre à celui d'uvicorn.
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Volontairement choisi, et non engendré. Tant que le produit Collection
      # du sandbox MTN est saturé, l'encaissement tourne sur le double, et
      # c'est `scripts/confirmer_paiements.py` qui joue l'opérateur — depuis un
      # poste, le terminal distant étant réservé aux offres payantes. Un secret
      # engendré que personne ne connaît rendrait ce script inutilisable, et
      # aucune cotisation ne pourrait plus être confirmée.
      #   openssl rand -hex 32
      - key: MOMO_CALLBACK_SECRET
        sync: false
      # Chaîne de connexion Neon, branche production, connexion DIRECTE — pas
      # celle du pooler : PgBouncer en mode transaction rejette les requêtes
      # préparées de psycopg 3, et Alembic ne migre pas à travers un pooler.
      - key: DATABASE_URL
        sync: false
      # `fromService … property: host` ne renvoie que l'hôte, sans schéma.
      # Exemple : https://tontine-web-7208.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Mobile Money. Laisser vide fait tourner l'API sur le double de test.
      # L'URL de rappel doit porter le chemin complet : MTN n'enregistre qu'un
      # hôte au provisionnement, et ne rappellerait que la racine du domaine.
      # Exemple : https://tontine-api-jhph.onrender.com/api/v1/webhooks/momo
      - key: MOMO_CALLBACK_URL
        sync: false
      - key: MOMO_COLLECTION_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false

  - type: web
    name: tontine-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      # nginx écoute sur 8080 : voir frontend/nginx.conf.
      - key: PORT
        value: 8080
      # Figée à la compilation du bundle, Vite remplaçant les `import.meta.env`
      # par leur valeur littérale. La changer impose un redéploiement du front.
      # Exemple : https://tontine-api-jhph.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false
