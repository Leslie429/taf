# Déploiement de l'API sur Fly.io. La base vit chez Neon : voir le README.
#   fly apps create tontine-api
#   fly secrets set --stage -a tontine-api DATABASE_URL=... JWT_SECRET=... \
#     MOMO_CALLBACK_SECRET=... CORS_ORIGINS=https://tontine-web.fly.dev
#   fly deploy --remote-only

app = "tontine-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Fly exécute cette commande une seule fois, dans une machine éphémère, avant
  # de basculer le trafic. C'est ce qui garantit qu'une seule migration tourne :
  # dans le CMD, chaque machine lancerait la sienne. Un échec ici annule le
  # déploiement et laisse la version précédente en place.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  # La machine s'arrête quand personne ne s'en sert : sur une démonstration,
  # c'est la différence entre gratuit et facturé. Premier appel un peu lent.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
