server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Les fichiers versionnés par Vite portent une empreinte dans leur nom :
    # ils peuvent être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'index ne doit jamais être mis en cache, sinon un déploiement ne se voit
    # pas tant que le navigateur n'a pas expiré sa copie.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Application à page unique : toute route inconnue rend l'index, c'est
    # React Router qui décide ensuite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
