name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tontine
          POSTGRES_PASSWORD: tontine
          POSTGRES_DB: tontine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tontine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tontine:tontine@localhost:5432/tontine_test
      JWT_SECRET: secret-de-ci
      MOMO_CALLBACK_SECRET: dev-webhook-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typage
        run: mypy app

      - name: Tests
        run: pytest

      # Les tests créent leur schéma par metadata.create_all : sans cette
      # étape, une migration pourrait diverger des modèles sans que rien ne le
      # signale. On la joue sur une base neuve, puis on vérifie qu'Alembic ne
      # trouve plus aucune différence avec les modèles.
      - name: Migrations
        env:
          DATABASE_URL: postgresql+psycopg://tontine:tontine@localhost:5432/tontine_migrations
        run: |
          PGPASSWORD=tontine createdb -h localhost -U tontine tontine_migrations
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - run: npm install

      - name: Typage
        run: npx tsc -b

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
